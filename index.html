<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utsav Pro | Premium Festival Posters</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Auth View -->
    <div id="auth-view" class="view active">
        <div class="auth-container split-screen">
            <div class="auth-brand">
                <div class="logo">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Utsav Pro
                </div>
                <h1>Create stunning festival posters in minutes.</h1>
                <p>Design. Customize. Download.</p>
            </div>
            <div class="auth-form-container glass-card">
                <form id="login-form" class="auth-form active">
                    <h2>Welcome Back</h2>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="login-password" required>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="login-btn">Login</button>
                    <p class="switch-auth">New here? <a href="#" id="show-signup">Create Account</a></p>
                </form>

                <form id="signup-form" class="auth-form hidden">
                    <h2>Create Account</h2>
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="signup-name" required>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary" id="signup-btn">Sign Up</button>
                    <p class="switch-auth">Already have an account? <a href="#" id="show-login">Login</a></p>
                </form>
            </div>
        </div>
    </div>

    <!-- App View (Dashboard & Generator) -->
    <div id="app-view" class="view hidden">
        <nav class="glass-nav">
            <div class="logo"><i class="fa-solid fa-wand-magic-sparkles"></i> Utsav Pro</div>
            <div class="nav-links">
                <button id="nav-dashboard" class="active">Dashboard</button>
                <button id="nav-generator">Create Poster</button>
            </div>
            <div class="user-menu">
                <span id="user-name-display"></span>
                <button id="logout-btn" class="btn-secondary">Logout</button>
            </div>
        </nav>

        <main class="app-content">
            <!-- Dashboard Section -->
            <section id="dashboard-section" class="section active">
                <div class="dashboard-header">
                    <h2>My Posters</h2>
                    <button class="btn-primary" id="create-new-btn"><i class="fa-solid fa-plus"></i> New Poster</button>
                </div>
                <div id="posters-grid" class="posters-grid">
                    <!-- Posters loaded via JS -->
                    <div class="empty-state">
                        <i class="fa-regular fa-image"></i>
                        <p>No posters yet. Create your first festival poster!</p>
                    </div>
                </div>
            </section>

            <!-- Generator Section (Keep existing logic isolated here) -->
            <section id="generator-section" class="section hidden">
                <div class="generator-layout">
                    <div class="controls-panel glass-card">
                        <h3>Customize</h3>
                        <!-- INSERT YOUR EXISTING GENERATOR INPUTS HERE -->
                        <div class="input-group">
                            <label>Festival Name</label>
                            <input type="text" id="festival-input" placeholder="e.g., Diwali">
                        </div>
                        <div class="input-group">
                            <label>Your Name</label>
                            <input type="text" id="name-input" placeholder="Enter your name">
                        </div>
                        <div class="input-group">
                            <label>Upload Photo</label>
                            <input type="file" id="photo-upload" accept="image/*">
                        </div>
                        <button class="btn-primary w-full" id="generate-poster-btn">Generate Poster</button>
                        <button class="btn-secondary w-full mt-2" id="save-poster-btn">Save to Dashboard</button>
                    </div>
                    <div class="preview-panel">
                        <!-- INSERT YOUR EXISTING CANVAS/PREVIEW HERE -->
                        <div id="poster-canvas" class="poster-preview">
                            <h1 id="preview-festival">Festival</h1>
                            <div class="photo-placeholder" id="preview-photo"></div>
                            <h2 id="preview-name">Your Name</h2>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase SDKs (v9 modular via module script) -->
    <script type="module" src="app.js"></script>
</body>
</html>
